# Model configurations
# Fill in API keys and model paths before running experiments

closed_source:
  # Closed-source vision model through an OpenAI-compatible endpoint.
  provider: "openai"
  model_name: "gpt-5.4"
  api_key: ""  # Set FOURROUTER_API_KEY in .env
  api_base: ""  # Set FOURROUTER_API_BASE in .env
  temperature: 0.0
  max_tokens: 1024
  timeout: 60

open_source:
  # Open-source vision-language model through an OpenAI-compatible endpoint.
  model_name: "Qwen/Qwen3-VL-8B-Instruct"
  device: "cuda"
  dtype: "float16"
  load_in_4bit: false
  max_new_tokens: 1024
  max_tokens: 1024
  temperature: 0.0
  use_api: true
  api_key: ""  # Set SILICONFLOW_API_KEY in .env
  api_base: ""  # Set SILICONFLOW_API_BASE in .env

judge_mllm:
  # Image-aware MLLM judge for the human-annotated subset
  provider: "openai"
  model_name: "gpt-5.4"
  api_key: ""  # Set FOURROUTER_API_KEY in .env
  api_base: ""  # Set FOURROUTER_API_BASE in .env
  temperature: 0.0
  max_tokens: 768
  text_only: false
